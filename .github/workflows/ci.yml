name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # build.gradle toolchain과 일치
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ubuntu-latest 러너는 Docker가 사전 설치/구동되어 있어 Testcontainers(MySQL/Redis)가 추가 설정 없이 동작한다.
      - name: Test and build
        run: ./gradlew test build --no-daemon
