# 운영: 안정성/성능 우선
# ⚠️ 학습용 플레이스홀더 - datasource가 빈 H2인데 validate라 지금 부팅하면 검증 실패.
#    "운영에선 validate가 정석"임을 보여주는 의도된 설정이며, 실제 부팅은 Phase 13(PostgreSQL+Flyway)에서 완성.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false
logging.level.root=WARN
logging.level.com.example.study_board=INFO
