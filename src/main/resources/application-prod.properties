# 운영: MySQL + Flyway + validate. 시크릿/접속정보는 환경변수로 주입
# (Phase 13에서 '빈 H2 + validate라 부팅 실패하던 플레이스홀더'를 실부팅 가능 상태로 완성)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT 시크릿은 반드시 환경변수로 주입 (기본값 없음 → 누락 시 부팅 실패)
jwt.secret=${JWT_SECRET}

# Phase 16: 인기글 캐싱용 Redis(접속정보 환경변수 주입, 기본 localhost:6379).
# starter-data-redis가 클래스패스에 있으면 캐시 타입은 redis가 기본 → 운영은 Redis 기동 필요.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

logging.level.root=WARN
logging.level.com.example.study_board=INFO

# Phase 15: 운영에선 API 문서/Swagger UI를 노출하지 않는다 (API 표면 비공개)
# dev/test는 기본값(enabled) 유지 → 별도 설정 불필요
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
