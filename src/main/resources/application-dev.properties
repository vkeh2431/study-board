# 개발: 로컬 MySQL(docker-compose) + Flyway. ddl-auto는 validate (스키마는 Flyway가 소유)
spring.datasource.url=jdbc:mysql://localhost:3306/studyboard?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=studyboard
spring.datasource.password=studyboard

# Flyway가 스키마를 관리, Hibernate는 검증만
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

# 로깅
logging.level.com.example.study_board=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
