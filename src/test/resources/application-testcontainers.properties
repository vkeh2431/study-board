# Phase 16: Testcontainers 실 MySQL 통합 테스트 전용 프로필.
# DataSource 접속 정보는 AbstractMySqlContainerTest의 @DynamicPropertySource가 주입하므로 여기엔 두지 않는다.
# test 프로필 위에 얹어(@ActiveProfiles({"test","testcontainers"})) Flyway/ddl-auto만 덮어쓴다.

# 실 MySQL에 V1~V3 마이그레이션을 적용하고, Hibernate는 엔티티 ↔ 스키마 일치만 검증한다.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
