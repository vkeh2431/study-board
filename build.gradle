plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'study_board'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    // Phase 13: 실 DB(MySQL) + Flyway 마이그레이션. 버전은 Spring Boot BOM이 관리.
    // starter가 Spring Boot Flyway 자동설정(spring-boot-flyway 모듈) + flyway-core를 끌어온다.
    // (Boot 4는 자동설정이 모듈로 분리되어 flyway-core만으론 Flyway가 부팅 시 실행되지 않는다)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // Phase 14: QueryDSL 동적 검색. 정통 com.querydsl 5.x/OpenFeign 6.x는 Hibernate 6.x/JPA 3.1 기준이라
    // Boot 4(Hibernate 7.2 + jakarta.persistence 3.2)에서 첫 동적쿼리 실행 시 NoSuchMethodError 위험.
    // OpenFeign 포크 7.2(Hibernate 7.x + JPA 3.2 대응)를 쓴다. 패키지는 com.querydsl.* 로 동일.
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.2'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.2:jakarta' // :jakarta classifier 필수
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'           // 버전은 Boot BOM이 관리
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    // Phase 15: Swagger/OpenAPI 문서화. springdoc 2.x는 Boot 3 전용(Spring 6/Jackson 2)이라 깨진다.
    // Boot 4(Spring 7 + Jackson 3 = tools.jackson)를 지원하는 3.0.x 계열을 명시 버전으로 고정한다
    // (Spring 의존성 관리 BOM이 springdoc 버전을 관리하지 않음).
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // Phase 16: Testcontainers로 통합 테스트를 실 MySQL에서 실행(H2 방언 차이 제거, V1~V3 + validate 자동 검증).
    // QueryDSL/springdoc/jjwt와 달리 이들은 Spring Boot BOM이 버전을 관리하므로 버전을 고정하지 않는다(고정 시 오히려 충돌).
    // ⚠️ Boot 4 BOM은 Testcontainers 2.x를 끌어오는데, 2.x에서 아티팩트 ID가 바뀌었다:
    //    junit-jupiter → testcontainers-junit-jupiter, mysql → testcontainers-mysql (구 좌표는 버전 미해결로 실패).
    // spring-boot-testcontainers가 @ServiceConnection(컨테이너 접속정보 자동 주입)을 제공한다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    // H2는 이제 test 프로파일 전용 (dev/prod는 MySQL)
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
